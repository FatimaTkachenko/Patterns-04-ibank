name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-ibank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Start SUT for IBank
        run: |
          nohup java -jar artifacts/app-ibank.jar -P:profile=test &

      - name: Run IBank tests
        run: ./gradlew test --info --tests "ru.netology.patterns.tests.AuthUITest" -Dselenide.headless=true